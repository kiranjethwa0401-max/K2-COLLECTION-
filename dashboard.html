<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K2 Collection | Dashboard</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f3ee;
    color:#1c1c1c;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:290px;
    height:100vh;
    background:linear-gradient(180deg,#1c1c1c,#111);
    color:#fff;
    padding:28px 18px;
    overflow-y:auto;
}

.logo{
    text-align:center;
    font-family:Georgia,serif;
    font-size:28px;
    letter-spacing:3px;
    margin-bottom:5px;
}

.logo-sub{
    text-align:center;
    color:#d4af6a;
    font-size:11px;
    letter-spacing:1.5px;
    margin-bottom:35px;
}

.menu-title{
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:20px 12px 10px;
}

.sidebar a{
    display:block;
    color:#ddd;
    text-decoration:none;
    padding:13px 14px;
    margin:5px 0;
    border-radius:10px;
    font-size:14px;
    transition:.2s;
}

.sidebar a:hover,
.sidebar a.active{
    background:#b08d57;
    color:#fff;
}

.sidebar a span{
    display:inline-block;
    width:28px;
}

/* MAIN */

.main{
    margin-left:290px;
    min-height:100vh;
}

/* TOP BAR */

.topbar{
    height:70px;
    background:#fff;
    border-bottom:1px solid #e5ded3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.search{
    width:330px;
}

.search input{
    width:100%;
    padding:11px 15px;
    border:1px solid #ddd;
    border-radius:25px;
    outline:none;
}

.top-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.notification{
    font-size:20px;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-icon{
    width:38px;
    height:38px;
    background:#b08d57;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}

/* CONTENT */

.content{
    padding:30px;
}

.welcome{
    background:linear-gradient(135deg,#1c1c1c,#333);
    color:#fff;
    border-radius:16px;
    padding:28px 30px;
    margin-bottom:25px;
}

.welcome h1{
    font-family:Georgia,serif;
    font-size:28px;
    margin-bottom:7px;
}

.welcome p{
    color:#ccc;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:28px;
}

.stat{
    background:#fff;
    border:1px solid #e5ded3;
    border-radius:14px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.stat-icon{
    font-size:27px;
    margin-bottom:10px;
}

.stat h3{
    font-size:28px;
    margin-bottom:4px;
}

.stat p{
    color:#777;
    font-size:13px;
}

/* QUICK ACTIONS */

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-heading h2{
    font-family:Georgia,serif;
    font-size:22px;
}

.quick-actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:30px;
}

.action{
    background:#fff;
    border:1px solid #e5ded3;
    border-radius:14px;
    padding:20px;
    text-decoration:none;
    color:#1c1c1c;
    transition:.2s;
}

.action:hover{
    transform:translateY(-3px);
    border-color:#b08d57;
}

.action-icon{
    font-size:28px;
    margin-bottom:10px;
}

.action h3{
    font-size:15px;
    margin-bottom:4px;
}

.action p{
    color:#777;
    font-size:12px;
}

/* LOWER GRID */

.dashboard-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:22px;
}

/* CARD */

.card{
    background:#fff;
    border:1px solid #e5ded3;
    border-radius:14px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.card-title{
    font-family:Georgia,serif;
    font-size:20px;
    margin-bottom:18px;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    color:#777;
    font-size:12px;
    padding:10px;
    border-bottom:1px solid #eee;
}

td{
    padding:12px 10px;
    border-bottom:1px solid #f0ece6;
    font-size:13px;
}

.product-cell{
    display:flex;
    align-items:center;
    gap:10px;
}

.product-cell img{
    width:42px;
    height:42px;
    object-fit:cover;
    border-radius:8px;
}

.badge{
    background:#f1e7d5;
    color:#7b5d32;
    padding:5px 9px;
    border-radius:15px;
    font-size:11px;
}

/* CATEGORY BOX */

.category-item{
    margin-bottom:18px;
}

.category-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
    font-size:13px;
}

.progress{
    height:8px;
    background:#eee;
    border-radius:10px;
    overflow:hidden;
}

.progress span{
    display:block;
    height:100%;
    background:#b08d57;
    border-radius:10px;
}

/* ACTIVITY */

.activity{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.activity strong{
    font-size:13px;
}

.activity p{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

/* MOBILE */

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .quick-actions{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .topbar{
        padding:15px;
        height:auto;
        gap:15px;
        flex-wrap:wrap;
    }

    .search{
        width:100%;
    }

    .content{
        padding:18px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .quick-actions{
        grid-template-columns:1fr;
    }

    table{
        min-width:650px;
    }

    .card{
        overflow-x:auto;
    }

}

</style>

</head>
