```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K2 Collection | Add Product</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f8f5f0;
    color:#333;
}

header{
    background:#1c1c1c;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#d4af6a;
    font-family:Georgia,serif;
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
}

nav a:hover{
    color:#d4af6a;
}

.container{
    max-width:850px;
    margin:45px auto;
    padding:0 20px;
}

h1{
    font-family:Georgia,serif;
    text-align:center;
    color:#1c1c1c;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form-box{
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#b08d57;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.add-btn{
    width:100%;
    border:none;
    background:#b08d57;
    color:white;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.add-btn:hover{
    background:#967544;
}

.note{
    background:#f8f5f0;
    border-left:4px solid #b08d57;
    padding:14px;
    margin-bottom:25px;
    font-size:14px;
    line-height:1.6;
}

.photo-name{
    margin-top:10px;
    font-size:14px;
    color:#777;
}

.photo-preview-box{
    position:relative;
    width:180px;
    margin-top:15px;
}

.photo-preview-box img{
    display:block;
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #ddd;
}

.remove-photo{
    position:absolute;
    top:-10px;
    right:-10px;
    width:28px;
    height:28px;
    border:none;
    border-radius:50%;
    background:#1c1c1c;
    color:white;
    font-size:20px;
    line-height:28px;
    cursor:pointer;
    display:none;
}

.remove-photo:hover{
    background:#b08d57;
}

footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:25px;
    margin-top:60px;
    font-size:13px;
}

@media(max-width:600px){
    header{
        flex-direction:column;
        gap:12px;
    }

    nav a{
        margin:0 7px;
    }

    .row{
        grid-template-columns:1fr;
        gap:0;
    }

    .form-box{
        padding:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">K2 Collection</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="all-products.html">All Products</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<div class="container">

    <h1>Add Product</h1>

    <p class="subtitle">
        Add a new jewellery product to your K2 Collection
    </p>

    <div class="form-box">

        <div class="note">
            <strong>Note:</strong> Abhi ye product form hai.
            Product ki actual website listing baad mein connect karenge.
        </div>

        <form>

            <div class="form-group">
                <label>Product Name</label>

                <input type="text"
                       placeholder="Example: Elegant Pearl Necklace">
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Category</label>

                    <select>
                        <option value="">Select Category</option>
                        <option>Necklaces</option>
                        <option>Bracelets</option>
                        <option>Rings</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price</label>

                    <input type="text"
                           placeholder="Example: ₹499">
                </div>

            </div>

            <!-- PRODUCT PHOTO -->

            <div class="form-group">

                <label>📸 Upload Product Photo</label>

                <input type="file"
                       id="productPhoto"
                       accept="image/jpeg,image/png,image/webp">

                <div id="photoName"
                     class="photo-name">
                </div>

                <div class="photo-preview-box" id="photoBox">

                    <img id="photoPreview"
                         alt="Product Preview">

                    <button type="button"
                            class="remove-photo"
                            id="removePhoto">×</button>

                </div>

            </div>

            <div class="form-group">

                <label>Amazon Affiliate Link</label>

                <input type="url"
                       placeholder="Paste your Amazon affiliate link here">

            </div>

            <div class="form-group">

                <label>Product Description</label>

                <textarea
                    placeholder="Write a short description about this jewellery product"></textarea>

            </div>

         <button type="button"
        class="add-btn"
        onclick="window.location.href='all-products.html';">
    Add Product
</button>

        </form>

    </div>

</div>

<footer>
    © 2026 K2 Collection • Elegant Jewellery
</footer>

<script>

const productPhoto = document.getElementById("productPhoto");
const photoPreview = document.getElementById("photoPreview");
const photoName = document.getElementById("photoName");
const removePhoto = document.getElementById("removePhoto");
const photoBox = document.getElementById("photoBox");

productPhoto.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        photoName.textContent = "Selected: " + file.name;

        const reader = new FileReader();

        reader.onload = function(e){

            photoPreview.src = e.target.result;
            photoBox.style.display = "block";
            removePhoto.style.display = "block";

        };

        reader.readAsDataURL(file);

    }

});

removePhoto.addEventListener("click", function(){

    productPhoto.value = "";
    photoPreview.src = "";
    photoName.textContent = "";
    photoBox.style.display = "none";
    removePhoto.style.display = "none";

});

photoBox.style.display = "none";

</script>

</body>
</html>
```
