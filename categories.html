.collection-intro p{

.category-buttons{
    display:flex;

.category-buttons button{
    border:1px solid #c9a96a;

    color:#2b241d;
    padding:12px 24px;
    border-radius:30px;
    cursor:pointer;
    font-size:15px;
    transition:.2s;
}

.category-buttons button:hover,
.category-buttons button.active{
    background:#2b241d;
    color:#fff;
}

/* PRODUCT GRID */

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    padding-bottom:40px;
}

.product-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    border:1px solid #eee3d5;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-4px);
}

.product-card img{

.product-info p{

.buy-btn{

    font-size:14px;
}

.buy-btn:hover{

/* EMPTY */

.no-products{

}

/* FOOTER */

footer{
    text-align:center;
    padding:30px 15px;
    border-top:1px solid #e4d9cc;
    color:#746a61;
    font-size:13px;
}

/* TABLET */

@media(max-width:900px){

    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-card img{
        height:280px;
    }
}

/* MOBILE */

@media(max-width:600px){

    .collection-intro h1{
        font-size:30px;
    }

        grid-template-columns:1fr;

        height:320px;

}

/* AMAZON LINK */

function getAmazonLink(product){

    if(product.amazon_link) return product.amazon_link;
    if(product.amazonLink) return product.amazonLink;
    if(product.affiliate_link) return product.affiliate_link;
    if(product.affiliateLink) return product.affiliateLink;
    if(product.link) return product.link;

    if(product.asin){

        return "https://www.amazon.in/dp/" +
        product.asin +
        "/?tag=" +
        affiliateTag;

    }

    return "#";
}


/* CATEGORY */

function getCategory(product){

    if(product.category){

        const c = String(product.category).toLowerCase();

        if(c.includes("ring")) return "Rings";
        if(c.includes("bracelet")) return "Bracelets";
        if(c.includes("necklace")) return "Necklaces";

    }

    const text =
        (
            (product.name || "") +
            " " +
            (product.description || "")
        ).toLowerCase();

    if(text.includes("ring"))
        return "Rings";

    if(text.includes("bracelet") ||
       text.includes("bangle"))
        return "Bracelets";

    if(text.includes("necklace") ||
       text.includes("jewellery set") ||
       text.includes("jewelry set"))
        return "Necklaces";

    return "Necklaces";
}


/* IMAGE */

function getImage(product){

    return product.image ||
           product.image_url ||
           product.imageUrl ||
           product.photo ||
           product.photo_url ||
           product.img ||
           "";
}


/* NAME */

function getName(product){

    return product.name ||
           product.product_name ||
           product.productName ||
           "K2 Jewellery";
}


/* LOAD SUPABASE */

async function loadProducts(){

    try{

        const response = await fetch(
            supabaseUrl +
            "/rest/v1/products?select=*",
            {
                headers:{
                    apikey:supabaseKey,
                    Authorization:"Bearer " + supabaseKey
                }
            }
        );

        if(!response.ok) return;

        const data = await response.json();

        if(Array.isArray(data)){

            data.forEach(item => {

                const itemName =
                    getName(item).toLowerCase().trim();

                const exists =
                    allProducts.some(product =>
                        getName(product).toLowerCase().trim()
                        === itemName
                    );

                if(!exists){

                    allProducts.push(item);

                }

            });

        }

    }catch(error){

        console.log("Supabase error:",error);

    }

    showCategory("All");

}


/* SHOW PRODUCTS */

function showCategory(category,button){

    if(button){

        document
        .querySelectorAll(".category-buttons button")
        .forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

    }

    const grid =
        document.getElementById("productsGrid");

    grid.innerHTML = "";

    let products = allProducts;

    if(category !== "All"){

        products =
            allProducts.filter(product =>
                getCategory(product) === category
            );

    }

    if(products.length === 0){

        grid.innerHTML =
        '<div class="no-products">' +
        'No products found.' +
        '</div>';

        return;

    }


    products.forEach(product => {
