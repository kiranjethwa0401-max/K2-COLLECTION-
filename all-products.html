<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K2 Collection | All Products</title>

<meta name="description"
content="K2 Collection - elegant and trendy jewellery picks for women.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:#f7f2e9;
    color:#33291f;
}

/* HEADER */

header{
    background:#fffdf9;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #e7dccb;
    box-shadow:0 4px 18px rgba(70,50,30,0.05);
}

.logo{
    font-family:Georgia,serif;
    font-size:28px;
    font-weight:bold;
    letter-spacing:3px;
    color:#b08d57;
}

.tagline{
    margin-top:7px;
    font-size:11px;
    letter-spacing:2px;
    color:#776755;
}

/* PAGE TITLE */

.page-title{
    text-align:center;
    padding:50px 20px 30px;
}

.page-title h1{
    font-family:Georgia,serif;
    font-size:40px;
    font-weight:normal;
    color:#33291f;
    margin-bottom:10px;
}

.page-title p{
    color:#756758;
    font-size:14px;
}

/* SEARCH */

.search-area{
    max-width:650px;
    margin:0 auto 25px;
    padding:0 20px;
}

.search-box{
    width:100%;
    padding:14px 20px;
    border:1px solid #dccdb8;
    border-radius:30px;
    background:white;
    outline:none;
    font-size:14px;
    color:#33291f;
    box-shadow:0 4px 15px rgba(70,50,30,.04);
}

.search-box::placeholder{
    color:#9a8977;
}

.search-box:focus{
    border-color:#b08d57;
    box-shadow:0 0 0 3px rgba(176,141,87,.10);
}

/* FILTERS */

.filters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:0 auto 40px;
    padding:0 20px;
}

.filter-btn{
    border:1px solid #d4c2a8;
    background:#fffdf9;
    color:#6e5330;
    padding:10px 21px;
    border-radius:25px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:.3s;
}

.filter-btn:hover,
.filter-btn.active{
    background:#b08d57;
    color:white;
    border-color:#b08d57;
}

/* PRODUCTS */

.products-container{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 70px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

/* PRODUCT CARD */

.product-card{
    background:#fffdf9;
    border:1px solid #e8ddcd;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 7px 22px rgba(65,48,30,.06);
    transition:.3s;
    position:relative;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 14px 30px rgba(65,48,30,.11);
}

/* IMAGE */

.product-image-link{
    display:block;
    text-decoration:none;
}

.product-image{
    width:100%;
    height:270px;
    object-fit:contain;
    display:block;
    background:#eee5d8;
    padding:10px;
}

/* PRODUCT INFO */

.product-info{
    padding:19px;
}

.category{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:#b08d57;
    margin-bottom:8px;
    font-weight:600;
}

.product-name{
    font-family:Georgia,serif;
    font-size:18px;
    font-weight:normal;
    color:#33291f;
    line-height:1.4;
    margin-bottom:9px;
}

.description{
    font-size:12px;
    line-height:1.55;
    color:#806f5d;
    margin-bottom:16px;
}

/* PRICE HIDDEN */

.price{
    display:none;
}

/* AMAZON BUTTON */

.buy-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#33291f;
    color:white;
    padding:12px 15px;
    border-radius:25px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.3px;
    transition:.3s;
}

.buy-btn:hover{
    background:#b08d57;
    transform:translateY(-1px);
}

/* LOADING */

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:50px;
    color:#806f5d;
    font-size:14px;
}

/* NO RESULTS */

.no-results{
    display:none;
    grid-column:1/-1;
    text-align:center;
    padding:55px 20px;
    color:#806f5d;
    font-size:15px;
}

/* ERROR */

.error-message{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:#9b3d3d;
    background:#fffdf9;
    border:1px solid #ead8d0;
    border-radius:16px;
}

/* FOOTER */

footer{
    background:#292118;
    text-align:center;
    padding:32px 20px;
    color:#d9cfc2;
    font-size:12px;
}

.footer-logo{
    font-family:Georgia,serif;
    color:#d2ad68;
    font-size:21px;
    letter-spacing:2px;
    margin-bottom:8px;
}

/* TABLET */

@media(max-width:1000px){

    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

/* MOBILE */

@media(max-width:700px){

    .logo{
        font-size:23px;
    }

    .tagline{
        font-size:9px;
        letter-spacing:1.5px;
    }

    .page-title{
        padding-top:38px;
    }

    .page-title h1{
        font-size:32px;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
        gap:15px;
    }

    .product-image{
        height:210px;
    }

    .product-info{
        padding:13px;
    }

    .product-name{
        font-size:15px;
    }

    .description{
        font-size:11px;
    }

    .buy-btn{
        padding:10px 7px;
        font-size:12px;
    }

}

@media(max-width:450px){

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-image{
        height:180px;
    }

}

</style>

</head>


<body>

<!-- HEADER -->

<header>

    <div class="logo">
        💎 K2 COLLECTION 💎
    </div>

    <div class="tagline">
        ELEGANT JEWELLERY • TIMELESS BEAUTY
    </div>

</header>


<!-- PAGE TITLE -->

<section class="page-title">

    <h1>
        All Products
    </h1>

    <p>
        Discover elegant and trendy jewellery
        for every occasion.
    </p>

</section>


<!-- SEARCH -->

<div class="search-area">

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search jewellery..."
    >

</div>


<!-- FILTERS -->

<div class="filters">

    <button
        class="filter-btn active"
        data-category="All">
        All
    </button>

    <button
        class="filter-btn"
        data-category="Rings">
        Rings
    </button>

    <button
        class="filter-btn"
        data-category="Bracelets">
        Bracelets
    </button>

    <button
        class="filter-btn"
        data-category="Necklaces">
        Necklaces
    </button>

</div>


<!-- PRODUCTS -->

<main class="products-container">

    <div
        id="productGrid"
        class="product-grid">

        <div
            id="loading"
            class="loading">

            Loading K2 Collection products...

        </div>

    </div>

</main>


<!-- FOOTER -->

<footer>

    <div class="footer-logo">
        K2 COLLECTION
    </div>

    Elegant Jewellery • Timeless Beauty

</footer>


<script>

/* =====================================================
   K2 COLLECTION
   SUPABASE ALL PRODUCTS
===================================================== */


/* =====================================================
   SUPABASE SETTINGS
===================================================== */

const supabaseUrl =
"https://mixhdtkzrcjtcfefdbyf.supabase.co";

const supabaseKey =
"sb_publishable_l_ViECvF-pUEp0Bzf_0aHA_09R-QHIo";

const affiliateTag =
"k2collection0-21";


/* =====================================================
   VARIABLES
===================================================== */

let allProducts = [];

let selectedCategory = "All";


/* =====================================================
   ELEMENTS
===================================================== */

const productGrid =
document.getElementById("productGrid");

const searchInput =
document.getElementById("searchInput");

const filterButtons =
document.querySelectorAll(".filter-btn");


/* =====================================================
   GET PRODUCT NAME
===================================================== */

function getProductName(product){

    return (
        product.Name ||
        product.name ||
        product.product_name ||
        product.productName ||
        "K2 Jewellery"
    );

}


/* =====================================================
   GET CATEGORY
===================================================== */

function getProductCategory(product){

    const category =
        String(
            product.category ||
            ""
        ).trim();

    const lowerCategory =
        category.toLowerCase();


    if(lowerCategory.includes("ring")){

        return "Rings";

    }


    if(lowerCategory.includes("bracelet") ||
       lowerCategory.includes("bangle")){

        return "Bracelets";

    }


    if(lowerCategory.includes("necklace")){

        return "Necklaces";

    }


    return category || "Jewellery";

}


/* =====================================================
   GET DESCRIPTION
===================================================== */

function getProductDescription(product){

    return (
        product.description ||
        "Beautiful jewellery selected by K2 Collection."
    );

}


/* =====================================================
   GET AMAZON LINK
===================================================== */

function getAmazonLink(product){

    if(product.affiliate_link){

        return product.affiliate_link;

    }


    if(product.affiliateLink){

        return product.affiliateLink;

    }


    if(product.amazon_link){

        return product.amazon_link;

    }


    if(product.amazonLink){

        return product.amazonLink;

    }


    return "#";

}


/* =====================================================
   GET IMAGE
===================================================== */

function getProductImage(product){

    return (
        product.image_url ||
        product.imageUrl ||
        product.image ||
        ""
    );

}


/* =====================================================
   IMAGE FALLBACK
===================================================== */

function handleImageError(img){

    const original =
        img.dataset.original;


    if(
        !original ||
        original.includes(".")
    ){

        img.style.display = "none";

        return;

    }


    img.onerror = function(){

        img.style.display = "none";

    };


    img.src =
        original + ".jpg";

}


/* =====================================================
   LOAD SUPABASE PRODUCTS
===================================================== */

async function loadProducts(){

    productGrid.innerHTML = `

        <div class="loading">

            Loading K2 Collection products...

        </div>

    `;


    try{

        const response =
            await fetch(
                supabaseUrl +
                "/rest/v1/products?select=*",
                {
                    method:"GET",

                    headers:{
                        "apikey":supabaseKey,
                        "Authorization":
                            "Bearer " + supabaseKey
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Supabase request failed"
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Invalid product data"
            );

        }


        allProducts = data;


        renderProducts();


    }catch(error){

        console.error(
            "Supabase Error:",
            error
        );


        productGrid.innerHTML = `

            <div class="error-message">

                <h3>
                    Products could not be loaded
                </h3>

                <br>

                <p>
                    Please refresh the page and try again.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const searchText =
        searchInput.value
        .toLowerCase()
        .trim();


    let filteredProducts =
        allProducts.filter(product => {


            const name =
                getProductName(product)
                .toLowerCase();


            const description =
                getProductDescription(product)
                .toLowerCase();


            const category =
                getProductCategory(product);


            const categoryMatch =
                selectedCategory === "All" ||
                category === selectedCategory;


            const searchMatch =
                !searchText ||
                name.includes(searchText) ||
                description.includes(searchText) ||
                category.toLowerCase()
                .includes(searchText);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    productGrid.innerHTML = "";


    if(filteredProducts.length === 0){

        productGrid.innerHTML = `

            <div
                class="no-results"
                style="display:block;"
            >

                No products found.

            </div>

        `;

        return;

    }


    filteredProducts.forEach(
        product => {

            createProductCard(product);

        }
    );

}


/* =====================================================
   CREATE PRODUCT CARD
===================================================== */

function createProductCard(product){

    const name =
        getProductName(product);


    const category =
        getProductCategory(product);


    const description =
        getProductDescription(product);


    const amazonLink =
        getAmazonLink(product);


    const image =
        getProductImage(product);


    const card =
        document.createElement("div");


    card.className =
        "product-card";


    /* IMAGE */

    let imageHTML = "";


    if(image){

        imageHTML = `

            <a
                class="product-image-link"
                href="${amazonLink}"
                target="_blank"
                rel="nofollow sponsored noopener"
            >

                <img
                    class="product-image"
                    src="${image}"
                    data-original="${image}"
                    alt="${escapeHTML(name)}"
                    loading="lazy"
                    onerror="handleImageError(this)"
                >

            </a>

        `;

    }else{

        imageHTML = `

            <div
                class="product-image"
                style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:45px;
                "
            >
                💎
            </div>

        `;

    }


    /* CARD */

    card.innerHTML = `

        ${imageHTML}

        <div class="product-info">

            <div class="category">

                ${escapeHTML(category)}

            </div>


            <div class="product-name">

                ${escapeHTML(name)}

            </div>


            <div class="description">

                ${escapeHTML(description)}

            </div>


            <a
                class="buy-btn"
                href="${amazonLink}"
                target="_blank"
                rel="nofollow sponsored noopener"
            >

                Buy Now →

            </a>

        </div>

    `;


    productGrid.appendChild(card);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        renderProducts();

    }
);


/* =====================================================
   CATEGORY FILTER
===================================================== */

filterButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function(){

                filterButtons.forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );


                this.classList.add(
                    "active"
                );


                selectedCategory =
                    this.dataset.category;


                renderProducts();

            }
        );

    }
);


/* =====================================================
   START
===================================================== */

loadProducts();

</script>

</body>

</html>
