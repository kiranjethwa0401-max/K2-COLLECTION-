/* ================================
   CATEGORY CHECK
================================ */

function getCorrectCategory(product){

    let category =
        String(product.category || "").trim().toLowerCase();

    if(
        category === "ring" ||
        category === "rings"
    ){
        return "Rings";
    }

    if(
        category === "bracelet" ||
        category === "bracelets"
    ){
        return "Bracelets";
    }

    if(
        category === "necklace" ||
        category === "necklaces"
    ){
        return "Necklaces";
    }


    const text = (
        String(product.name || "") +
        " " +
        String(product.description || "")
    ).toLowerCase();


    if(
        text.includes("ring") ||
        text.includes("amethyst") ||
        text.includes("sunflower ring")
    ){
        return "Rings";
    }


    if(
        text.includes("bracelet") ||
        text.includes("bangle")
    ){
        return "Bracelets";
    }


    if(
        text.includes("necklace") ||
        text.includes("neckless") ||
        text.includes("jewellery set") ||
        text.includes("jewelry set") ||
        text.includes("pearl set")
    ){
        return "Necklaces";
    }


    return "Necklaces";
}


/* ================================
   PRODUCT IMAGE
================================ */

function getProductImage(product){

    return (
        product.image ||
        product.image_url ||
        product.imageUrl ||
        "https://via.placeholder.com/600x500?text=K2+Collection"
    );

}


/* ================================
   PRODUCT LINK
================================ */

function getProductLink(product){

    return (
        product.amazon_link ||
        product.amazonLink ||
        product.link ||
        product.url ||
        "#"
    );

}


/* ================================
   PRODUCT NAME
================================ */

function getProductName(product){

    return (
        product.name ||
        product.product_name ||
        product.title ||
        "K2 Collection Jewellery"
    );

}


/* ================================
   DESCRIPTION
================================ */

function getProductDescription(product){

    return (
        product.description ||
        "Elegant jewellery selected by K2 Collection."
    );

}


/* ================================
   CREATE CARD
================================ */

function createProductCard(product){

    const category =
        getCorrectCategory(product);

    const image =
        getProductImage(product);

    const link =
        getProductLink(product);

    const name =
        getProductName(product);

    const description =
        getProductDescription(product);


    return `

        <div class="product-card">

            <a
                href="${link}"
                target="_blank"
                rel="nofollow sponsored noopener"
            >

                <img
                    src="${image}"
                    alt="${name}"
                    class="product-image"
                    loading="lazy"
                >

            </a>


            <div class="product-info">

                <div class="product-category">
                    ${category}
                </div>

                <h3 class="product-name">
                    ${name}
                </h3>

                <p class="product-description">
                    ${description}
                </p>

                <div class="amazon-text">
                    View on Amazon
                </div>

                <a
                    href="${link}"
                    target="_blank"
                    rel="nofollow sponsored noopener"
                    class="buy-btn"
                >
                    Buy Now →
                </a>

            </div>

        </div>

    `;

}


/* ================================
   RENDER PRODUCTS
================================ */

function renderProducts(products){

    const rings =
        document.getElementById("ringsProducts");

    const bracelets =
        document.getElementById("braceletsProducts");

    const necklaces =
        document.getElementById("necklacesProducts");


    rings.innerHTML = "";
    bracelets.innerHTML = "";
    necklaces.innerHTML = "";


    let ringCount = 0;
    let braceletCount = 0;
    let necklaceCount = 0;


    products.forEach(product => {

        const category =
            getCorrectCategory(product);


        if(category === "Rings"){

            rings.innerHTML +=
                createProductCard(product);

            ringCount++;

        }


        else if(category === "Bracelets"){

            bracelets.innerHTML +=
                createProductCard(product);

            braceletCount++;

        }


        else if(category === "Necklaces"){

            necklaces.innerHTML +=
                createProductCard(product);

            necklaceCount++;

        }

    });


    if(ringCount === 0){

        rings.innerHTML =
            `<div class="empty-message">
                No rings available yet.
            </div>`;

    }


    if(braceletCount === 0){

        bracelets.innerHTML =
            `<div class="empty-message">
                No bracelets available yet.
            </div>`;

    }


    if(necklaceCount === 0){

        necklaces.innerHTML =
            `<div class="empty-message">
                No necklaces available yet.
            </div>`;

    }

}


/* ================================
   REMOVE DUPLICATES
   WITHOUT DELETING DATA
================================ */

function removeDuplicates(products){

    const seen = new Set();

    return products.filter(product => {

        const link =
            getProductLink(product);

        const image =
            getProductImage(product);

        const name =
            getProductName(product);


        const key =
            String(
                product.id ||
                link ||
                image ||
                name
            ).toLowerCase();


        if(seen.has(key)){
            return false;
        }


        seen.add(key);

        return true;

    });

}


/* ================================
   LOAD SUPABASE PRODUCTS
================================ */

async function loadProducts(){

    let allProducts =
        [...existingProducts];


    try{

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/products?select=*`,
                {
                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                        `Bearer ${SUPABASE_KEY}`
                    }
                }
            );


        if(response.ok){

            const supabaseProducts =
                await response.json();


            allProducts =
                [
                    ...existingProducts,
                    ...supabaseProducts
                ];

        }

    }

    catch(error){

        console.log(
            "Supabase products could not be loaded.",
            error
        );

    }


    allProducts =
        removeDuplicates(allProducts);


    renderProducts(allProducts);

}


/* ================================
