<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K2 Collection | Amazon Products</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f3ee;
    color:#1c1c1c;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#1c1c1c,#111);
    color:#fff;
    padding:22px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:Georgia,serif;
    font-size:25px;
    letter-spacing:2px;
}

.logo span{
    color:#d4af6a;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#b08d57;
    padding:10px 17px;
    border-radius:8px;
    font-size:13px;
}

.back:hover{
    background:#967442;
}

/* MAIN */

.container{
    max-width:1200px;
    margin:auto;
    padding:35px 25px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-family:Georgia,serif;
    font-size:30px;
    margin-bottom:7px;
}

.page-title p{
    color:#777;
}

/* INFO */

.info{
    background:#fff;
    border:1px solid #e5ded3;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:25px;
}

.info strong{
    color:#7b5d32;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product{
    background:#fff;
    border:1px solid #e5ded3;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
    transition:.2s;
}

.product:hover{
    transform:translateY(-4px);
    border-color:#b08d57;
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:17px;
}

.product-info h3{
    font-family:Georgia,serif;
    font-size:16px;
    line-height:1.4;
    margin-bottom:9px;
}

.category{
    display:inline-block;
    background:#f1e7d5;
    color:#7b5d32;
    padding:5px 9px;
    border-radius:15px;
    font-size:11px;
    margin-bottom:13px;
}

.amazon-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#b08d57;
    color:#fff;
    padding:11px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
}

.amazon-btn:hover{
    background:#967442;
}

/* EMPTY */

.empty{
    background:#fff;
    border:1px solid #e5ded3;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    color:#777;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

/* MOBILE */

@media(max-width:1000px){

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:750px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .header{
        padding:18px;
    }

    .container{
        padding:25px 15px;
    }

    .products{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">
        💎 K2 <span>COLLECTION</span>
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<!-- MAIN -->

<main class="container">


<div class="page-title">

    <h1>
        🛒 Amazon Products
    </h1>

    <p>
        Your K2 Collection products connected with Amazon.
    </p>

</div>


<div class="info">

    <strong>
        Amazon Affiliate Products
    </strong>

    <br><br>

    All K2 Collection products connected with Amazon are shown below.

</div>


<div class="products" id="productsBox"></div>


<div class="empty" id="emptyBox" style="display:none;">

    <div class="empty-icon">
        🛒
    </div>

    <h2>
        No Products Found
    </h2>

    <p>
        Add a product from the Add Product section.
    </p>

</div>


</main>


<script>

/* ==========================================

    },


    /* BRACELETS */

    {
        name:"Nilu's Collection Sparkling Bracelet",

    {

    {

        image:"ring-4.jpg",
        category:"Rings",
        link:"https://www.amazon.in/dp/B0DCJ34XFS?tag=k2collection0-21"
    },

    {

        image:"ring-5.jpg",
        category:"Rings",
        link:"https://www.amazon.in/dp/B0D1QVVPJW?tag=k2collection0-21"
    }

];


/* ==========================================
   GET DASHBOARD PRODUCTS
========================================== */

let dashboardProducts = [];

try{

    dashboardProducts =
        JSON.parse(localStorage.getItem("k2Products")) || [];

}catch(error){

    dashboardProducts = [];

}


/* ==========================================
   COMBINE PRODUCTS
========================================== */

const allProducts = [...oldProducts];


/* ==========================================
   ADD DASHBOARD PRODUCTS
   WITHOUT DUPLICATES
========================================== */

dashboardProducts.forEach(product => {

    const name =
        product.name ||
        product.title ||
        product.productName ||
        "";

    if(!name) return;


    const normalizedName =
        name
        .toLowerCase()
        .replace(/\s+/g," ")
        .trim();


    const alreadyExists =
        allProducts.some(item => {

            const oldName =
                (item.name || "")
                .toLowerCase()
                .replace(/\s+/g," ")
                .trim();

            return oldName === normalizedName;

        });


    if(!alreadyExists){

        allProducts.push(product);

    }

});


/* ==========================================
   ELEMENTS
========================================== */

const productsBox =
    document.getElementById("productsBox");

const emptyBox =
    document.getElementById("emptyBox");


/* ==========================================
   EMPTY CHECK
========================================== */

if(allProducts.length === 0){

    emptyBox.style.display = "block";

}


/* ==========================================
   SHOW ALL PRODUCTS
========================================== */

allProducts.forEach(product => {


    /* AMAZON LINK */

    const amazonLink =
        product.amazonLink ||
        product.amazonUrl ||
        product.amazonURL ||
        product.amazon ||
        product.productLink ||
        product.productURL ||
        product.link ||
        product.url ||
        "";


    /* IMAGE */

    const image =
        product.image ||
        product.imageUrl ||
        product.imageURL ||
        product.photo ||
        product.photoUrl ||
        product.photoURL ||
        product.productImage ||
        "";


    /* NAME */

    const name =
        product.name ||
        product.title ||
        product.productName ||
        "K2 Collection Product";


    /* CATEGORY */

    const category =
        product.category ||
        product.type ||
        "Jewellery";


    /* CARD */

    const card =
        document.createElement("div");

    card.className = "product";


    /* AMAZON BUTTON */

    let amazonButton = "";


    if(amazonLink){

        amazonButton = `

            <a
                href="${amazonLink}"
                target="_blank"
                rel="noopener noreferrer"
                class="amazon-btn"
            >
                View on Amazon →
            </a>

        `;

    }else{

        amazonButton = `

            <div
                style="
                    background:#eee;
                    color:#777;
                    text-align:center;
                    padding:11px;
                    border-radius:8px;
                    font-size:13px;
                "
            >
                Amazon Link Not Added
            </div>

        `;

    }


    /* IMAGE */

    let imageHTML = "";


    if(image){

        if(amazonLink){

            imageHTML = `

                <a
                    href="${amazonLink}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <img
                        src="${image}"
                        alt="${name}"
                    >

                </a>

            `;

        }else{

            imageHTML = `

                <img
                    src="${image}"
                    alt="${name}"
                >

            `;

        }

    }else{

        imageHTML = `

            <div
                style="
                    height:220px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#f1eee8;
                    font-size:50px;
                "
            >
                💎
            </div>

        `;

    }


    /* CARD HTML */

    card.innerHTML = `

        ${imageHTML}

        <div class="product-info">

            <h3>
                ${name}
            </h3>

            <span class="category">
                ${category}
            </span>

            ${amazonButton}

        </div>

    `;


    productsBox.appendChild(card);

});


</script>

</body>

</html>
