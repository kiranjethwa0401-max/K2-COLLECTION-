<!DOCTYPE html>
<html>
<head>
    <title>K2 Collection</title>

    <style>
    body {
        font-family: Arial;
        background-color: #ffe6f0;
        text-align: center;
        margin: 0;
    }

    h1 {
        background-color: #d63384;
        color: white;
        padding: 20px;
        margin: 0;
    }

    .welcome {
        padding: 20px;
    }

    .product {
        background-color: white;
        width: 280px;
        margin: 20px auto;
        padding: 15px;
        border-radius: 15px;
    }

    .product img {
        width: 100%;
        height: 250px;
        object-fit: contain;
        border-radius: 10px;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
    }

    button {
        background-color: #d63384;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 20px;
    }
</style>
</head>

<body>

    <h1>💎 K2 COLLECTION 💎</h1>

    <div class="welcome">
        <h2>Welcome to K2 Collection</h2>
        <p>Beautiful Jewellery for Every Occasion ✨</p>
    </div>

    <!-- Ring Product -->
    <div class="product">
        <img src="ring.jpg" alt="Beautiful Ring">
        <h2>Beautiful Ring 💍</h2>
        <p class="price">₹283</p>

        <a href="https://www.amazon.in/gp/aw/d/B0CZ42S5JJ?linkCode=ll2&tag=k2collection0-21"
           target="_blank">
            <button>Buy Now</button>
        </a>
    </div>

    <!-- Bracelet Product -->
    <div class="product">
        <img src="bracelet.jpg" alt="Beautiful Bracelet">
        <h2>Beautiful Bracelet ✨</h2>
        <p class="price">₹379</p>

        <a href="https://link.amazon/B0ck3Vpwg"
           target="_blank">
            <button>Buy Now</button>
        </a>
    </div>

    <!-- Necklace Product -->
    <div class="product">
        <img src="necklace.jpg" alt="Beautiful Necklace">
        <h2>Beautiful Necklace 💎</h2>
        <p class="price">₹249</p>

        <a href="https://link.amazon/B0doWg1YB"
           target="_blank">
            <button>Buy Now</button>
        </a>
    </div>

</body>
    </html>
